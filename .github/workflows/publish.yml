name: Fetch and publish

on:
  schedule:
    - cron: "17 * * * *"        # hourly
  push:
    branches: [main]
    paths: ["data/posts.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Read feeds
        run: python scripts/fetch_feeds.py
      - name: Fallback headlines if no edited posts for a while
        run: python scripts/fallback.py
      - name: Draw cards
        run: python scripts/make_cards.py
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: "@finpuls_ua"
        run: python scripts/post_telegram.py
      - name: Save
        run: |
          git config user.name "finpuls-bot"
          git config user.email "finpuls-bot@users.noreply.github.com"
          git add -A data cards
          git diff --cached --quiet && exit 0
          git commit -m "Update feed data"
          git pull --rebase --autostash
          git push
